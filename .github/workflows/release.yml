name: Release

# Tag a release: `git tag v0.95.0 && git push origin v0.95.0`.
# The tag must equal the plugin header `Version:` and the
# AIYA_CORE_VERSION constant — the gate step fails otherwise.
# workflow_dispatch builds both zips and uploads them as a dry-run
# artifact without touching the releases page.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # Tag builds only receive the single tag being built by
                  # default; the changelog step needs the previous tag too.
                  fetch-tags: true

            - name: Resolve the version from the tag
              id: version
              run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Gate the tag against the plugin version stamps
              if: github.event_name == 'push'
              run: |
                  VERSION="${{ steps.version.outputs.VERSION }}"
                  HEADER=$(grep -oP '^ \* Version: \K.*' aiya-core.php)
                  CONST=$(grep -oP "define\('AIYA_CORE_VERSION', '\K[^']+" aiya-core.php)
                  echo "tag=v$VERSION / header=$HEADER / const=$CONST"
                  if [ "$VERSION" != "$HEADER" ]; then
                      echo "::error::tag v$VERSION does not match the plugin header Version: $HEADER"
                      exit 1
                  fi
                  if [ "$VERSION" != "$CONST" ]; then
                      echo "::error::tag v$VERSION does not match AIYA_CORE_VERSION: $CONST"
                      exit 1
                  fi

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  tools: composer:v2
                  coverage: none

            - name: Point composer at the official packagist (the repo pins a CN mirror for local dev)
              run: composer config repositories.packagist composer https://repo.packagist.org

            - name: Install production dependencies
              run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            - name: Compile translations
              run: |
                  sudo apt-get update -q && sudo apt-get install -y -q gettext
                  msgfmt --version | head -n1
                  msgfmt languages/aiya-core-zh_CN.po -o languages/aiya-core-zh_CN.mo

            - name: Stage the plugin package
              run: |
                  rm -rf build && mkdir -p build
                  # The root themes/ directory only carries the aiya-headless
                  # sync source for the working tree — a plugin package never
                  # contains a theme, so it is stripped here. The root-only
                  # dev files are anchored with a leading slash: an unanchored
                  # rsync pattern matches at every depth, and a bare
                  # `composer.json` stripped the packages' own manifests —
                  # the only source the Runtime/Packages lazy autoloader
                  # reads — so the shipped plugin could not load a single
                  # Aiya\Infra\* class (caught live: every save under an
                  # ID-slug mode died on the missing IdSlugEncoder).
                  rsync -a ./ build/aiya-cms-core/ \
                      --exclude .git \
                      --exclude .github \
                      --exclude tests \
                      --exclude docs \
                      --exclude node_modules \
                      --exclude themes \
                      --exclude .gitignore \
                      --exclude .gitattributes \
                      --exclude /composer.json \
                      --exclude /composer.lock \
                      --exclude /phpunit.xml.dist \
                      --exclude /phpcs.xml.dist \
                      --exclude /phpstan.neon.dist \
                      --exclude /phpstan-bootstrap.php \
                      --exclude /backend-snap.json \
                      --exclude '*.zip' \
                      --exclude '*.log'
                  # The package manifests are the lazy autoloader's only
                  # source of truth; gate the build on them surviving staging.
                  MANIFESTS=$(find packages -maxdepth 2 -name composer.json | wc -l)
                  STAGED=$(find build/aiya-cms-core/packages -maxdepth 2 -name composer.json | wc -l)
                  echo "package manifests: repo=$MANIFESTS staged=$STAGED"
                  if [ "$MANIFESTS" -eq 0 ] || [ "$MANIFESTS" != "$STAGED" ]; then
                      echo "::error::package composer.json manifests missing from the staged plugin — the lazy Aiya\\Infra\\* autoloader would ship dead"
                      exit 1
                  fi
                  test -f build/aiya-cms-core/packages/slug-toolkit/src/IdSlugEncoder.php
                  find build/aiya-cms-core -name '.DS_Store' -type f -delete

            # Exactly one zip asset rides every release: the online-update
            # checker (Plugin Update Checker, GitHub mode) uses the release's
            # zip as the download, so the shell theme is deliberately not
            # packaged here.
            - name: Zip the package
              run: |
                  cd build
                  zip -r -q "aiya-cms-core-${{ steps.version.outputs.VERSION }}.zip" aiya-cms-core
                  unzip -l "aiya-cms-core-${{ steps.version.outputs.VERSION }}.zip" | tail -n1

            - name: Collect the changelog since the previous tag
              if: github.event_name == 'push'
              id: changelog
              run: |
                  CURRENT_TAG="$GITHUB_REF_NAME"
                  PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -Fxv "$CURRENT_TAG" | head -n1 || true)
                  echo "Current tag: $CURRENT_TAG / previous: ${PREVIOUS_TAG:-none}"
                  if [ -z "$PREVIOUS_TAG" ]; then
                      CHANGELOG="- Initial release"
                  else
                      CHANGELOG=$(git log "${PREVIOUS_TAG}..${CURRENT_TAG}" --pretty=format:"- %s" --no-merges)
                  fi
                  echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
                  echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"

            - name: Upload the dry-run artifact (manual builds only)
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: release-packages
                  path: build/*.zip

            - name: Create the GitHub release (tag builds only)
              if: github.event_name == 'push'
              uses: softprops/action-gh-release@v2
              with:
                  name: AIYA CMS Core ${{ steps.version.outputs.VERSION }}
                  body: |
                      AIYA CMS Core ${{ steps.version.outputs.VERSION }} — the headless
                      WordPress backend plugin.

                      #### Changes
                      ${{ steps.changelog.outputs.CHANGELOG }}

                      #### Files
                      - `aiya-cms-core-${{ steps.version.outputs.VERSION }}.zip` → unzip into `wp-content/plugins/` (production `vendor/` and the compiled zh_CN `.mo` are inside; drop the root `composer.json`/`composer.lock` and dev configs)

                      The online-update checker consumes this release's zip asset; the `aiya-headless` shell theme (repo root `themes/`) is not distributed here.
                  generate_release_notes: true
                  files: |
                      build/*.zip
                  draft: false
                  # Semver pre-release tags (e.g. 0.94.0-beta.1) cut a GitHub
                  # pre-release, which the update checker skips by default —
                  # beta channel never rides production auto-updates.
                  prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
